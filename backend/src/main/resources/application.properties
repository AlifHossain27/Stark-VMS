spring.application.name=backend

# Datasource configuration with environment variable fallbacks
spring.datasource.url=${DB_URL:jdbc:h2:mem:starkvms;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
# driver-class-name is auto-detected from URL if DB_DRIVER is not set
spring.datasource.driver-class-name=${DB_DRIVER:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
